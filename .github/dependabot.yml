# Dependabot alerts and version updates are available on private repositories
# at no cost, unlike code scanning.
version: 2
updates:
  - package-ecosystem: pip
    directory: /ingestion-service
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /worker-service
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /ingestion-service
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /worker-service
    schedule:
      interval: weekly
