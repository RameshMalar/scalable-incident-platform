name: CD on merge

# Deploys every deployable merge to main. CD itself stays dispatch-only, so its
# inputs remain explicit: this reads the reviewed infra/cd-production.json at
# the merged commit and dispatches CD with it, as scripts/run-cd.sh does by hand.
# CD's preflight still refuses anything but the merge of an approved pull
# request, so a direct push to main produces a refused run, not a deployment.
#
# A workflow_dispatch made with the built-in token does start a run; GitHub
# exempts it from the rule that the built-in token's events trigger nothing.
# This workflow never signs in to Azure.

on:
  push:
    branches: [main]
    # These paths do not change a deployed workload. Evidence images are
    # uploaded by the Evidence workflows; a manifest change still deploys
    # because the ingestion image packages it.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'evidence_images/**'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    name: Dispatch CD with the reviewed inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Dispatch CD on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          inputs=()
          while IFS= read -r pair; do
            inputs+=(-f "$pair")
          done < <(jq -r 'to_entries[] | "\(.key)=\(.value | tostring)"' infra/cd-production.json)
          inputs+=(-f "expected_deploy_sha=${GITHUB_SHA}")
          gh workflow run cd.yml --repo "$GITHUB_REPOSITORY" --ref main "${inputs[@]}"
          echo "Dispatched CD after ${GITHUB_SHA::7} with the inputs in infra/cd-production.json" >> "$GITHUB_STEP_SUMMARY"
