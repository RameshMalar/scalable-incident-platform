name: Reviewed CD dispatch

# Manual-only dispatcher: merging source must never start an Azure rollout.
# This reads the reviewed infra/cd-production.json and dispatches CD on main
# only after a deliberate workflow_dispatch, as scripts/run-cd.sh does by hand.
# CD's preflight still refuses anything but the merge of an approved pull
# request, so a direct push to main produces a refused run, not a deployment.
#
# A workflow_dispatch made with the built-in token does start a run; GitHub
# exempts it from the rule that the built-in token's events trigger nothing.
# This workflow never signs in to Azure.

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    name: Dispatch CD with the reviewed inputs
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Dispatch CD on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          inputs=()
          while IFS= read -r pair; do
            inputs+=(-f "$pair")
          done < <(jq -r 'to_entries[] | "\(.key)=\(.value | tostring)"' infra/cd-production.json)
          gh workflow run cd.yml --repo "$GITHUB_REPOSITORY" --ref main "${inputs[@]}"
          echo "Manually dispatched CD for ${GITHUB_SHA::7} with the inputs in infra/cd-production.json" >> "$GITHUB_STEP_SUMMARY"
