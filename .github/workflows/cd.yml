name: CD

# Deploys main to Azure.
# Authentication uses OpenID Connect against a managed identity,
# so no Azure credential is stored in GitHub.
on:
  push:
    branches:
      - main
    paths:
      - 'ingestion-service/**'
      - 'worker-service/**'
      - 'notification-service/**'
      - 'business-dashboard/**'
      - 'load-simulator/**'
      - 'infra/**'
      - '.github/workflows/cd.yml'

      # Three services install the Common Event Model into their images, so a
      # change to the contract changes what runs in production even though no
      # service directory was touched. Without this, the deployed services would
      # keep serving the previous contract.
      - 'packages/**'

      # Decides what reaches the build context for those same three images.
      - '.dockerignore'

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}

jobs:
  deploy:
    name: Provision and deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      # -----------------------------------------------------------------------
      # Checkout
      # -----------------------------------------------------------------------

      - uses: actions/checkout@v7

      # -----------------------------------------------------------------------
      # Azure authentication
      # -----------------------------------------------------------------------

      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # -----------------------------------------------------------------------
      # Core infrastructure
      # -----------------------------------------------------------------------

      - name: Deploy core infrastructure
        id: core
        run: |
          outputs=$(az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/core.bicep \
            --name "core-${GITHUB_SHA::7}" \
            --parameters \
              developerPrincipalIds='${{ vars.DEVELOPER_PRINCIPAL_IDS }}' \
            --query properties.outputs \
            -o json)

          for key in \
            registryName \
            registryLoginServer \
            environmentId \
            logAnalyticsWorkspaceId \
            ingestionIdentityId \
            ingestionIdentityClientId \
            workerIdentityId \
            workerIdentityClientId \
            scalerIdentityId \
            serviceBusName \
            serviceBusFqdn \
            incidentQueueName \
            cosmosAccountName \
            cosmosEndpoint \
            cosmosDatabaseName \
            cosmosContainerName \
            notificationIdentityId \
            notificationIdentityClientId \
            notificationScalerIdentityId \
            notificationQueueName \
            keyVaultName \
            dashboardIdentityId \
            dashboardIdentityClientId \
            evidenceBlobEndpoint \
            evidenceContainerName
          do
            value=$(echo "$outputs" | jq -r ".${key}.value")
            echo "${key}=${value}" >> "$GITHUB_OUTPUT"
          done

      # -----------------------------------------------------------------------
      # Build container images
      # -----------------------------------------------------------------------

      - name: Build and push images
        id: image
        run: |
          registry='${{ steps.core.outputs.registryLoginServer }}'

          # $1 image, $2 service directory, $3 build context. The context is the
          # repository root for the services that install the Common Event Model,
          # because a Dockerfile can only copy from inside its own context.
          build_and_push() {
            docker buildx build \
              --platform linux/amd64 \
              --tag "${registry}/$1:${GITHUB_SHA}" \
              --tag "${registry}/$1:latest" \
              --file "$2/Dockerfile" \
              --push \
              "$3"
          }

          for attempt in 1 2 3; do
            if az acr login \
              --name '${{ steps.core.outputs.registryName }}' \
              && build_and_push incident-ingestion ingestion-service . \
              && build_and_push incident-worker worker-service . \
              && build_and_push incident-notification notification-service . \
              && build_and_push incident-dashboard business-dashboard ./business-dashboard \
              && build_and_push incident-load-simulator load-simulator ./load-simulator; then

              echo "ingestion=${registry}/incident-ingestion:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
              echo "worker=${registry}/incident-worker:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
              echo "notification=${registry}/incident-notification:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
              echo "dashboard=${registry}/incident-dashboard:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
              echo "simulator=${registry}/incident-load-simulator:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 20))
              echo "::warning::Build attempt ${attempt} failed, retrying in ${delay}s"
              sleep "$delay"
            fi
          done

          echo "::error::Build failed after 3 attempts" >&2
          exit 1

      # -----------------------------------------------------------------------
      # Deploy ingestion service
      # -----------------------------------------------------------------------

      - name: Deploy the ingestion service
        id: app
        run: |
          url=$(az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/ingestion.bicep \
            --name "ingestion-${GITHUB_SHA::7}" \
            --parameters \
              environmentId='${{ steps.core.outputs.environmentId }}' \
              identityId='${{ steps.core.outputs.ingestionIdentityId }}' \
              identityClientId='${{ steps.core.outputs.ingestionIdentityClientId }}' \
              logAnalyticsWorkspaceId='${{ steps.core.outputs.logAnalyticsWorkspaceId }}' \
              serviceBusFqdn='${{ steps.core.outputs.serviceBusFqdn }}' \
              serviceBusQueue='${{ steps.core.outputs.incidentQueueName }}' \
              authAudience='${{ vars.AUTH_AUDIENCE }}' \
              tenantMap='${{ vars.TENANT_MAP }}' \
              image='${{ steps.image.outputs.ingestion }}' \
            --query properties.outputs.url.value \
            -o tsv)

          echo "url=${url}" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # Deploy processing worker
      # -----------------------------------------------------------------------

      - name: Deploy the processing worker
        run: |
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/worker.bicep \
            --name "worker-${GITHUB_SHA::7}" \
            --parameters \
              environmentId='${{ steps.core.outputs.environmentId }}' \
              identityId='${{ steps.core.outputs.workerIdentityId }}' \
              identityClientId='${{ steps.core.outputs.workerIdentityClientId }}' \
              scalerIdentityId='${{ steps.core.outputs.scalerIdentityId }}' \
              logAnalyticsWorkspaceId='${{ steps.core.outputs.logAnalyticsWorkspaceId }}' \
              serviceBusFqdn='${{ steps.core.outputs.serviceBusFqdn }}' \
              serviceBusNamespace='${{ steps.core.outputs.serviceBusName }}' \
              serviceBusQueue='${{ steps.core.outputs.incidentQueueName }}' \
              notificationQueue='${{ steps.core.outputs.notificationQueueName }}' \
              cosmosEndpoint='${{ steps.core.outputs.cosmosEndpoint }}' \
              cosmosDatabase='${{ steps.core.outputs.cosmosDatabaseName }}' \
              cosmosContainer='${{ steps.core.outputs.cosmosContainerName }}' \
              registryServer='${{ steps.core.outputs.registryLoginServer }}' \
              image='${{ steps.image.outputs.worker }}' \
            --query properties.outputs.appName.value \
            -o tsv

      # -----------------------------------------------------------------------
      # Deploy notification service
      # -----------------------------------------------------------------------

      - name: Deploy the notification service
        run: |
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/notification.bicep \
            --name "notification-${GITHUB_SHA::7}" \
            --parameters \
              environmentId='${{ steps.core.outputs.environmentId }}' \
              identityId='${{ steps.core.outputs.notificationIdentityId }}' \
              identityClientId='${{ steps.core.outputs.notificationIdentityClientId }}' \
              scalerIdentityId='${{ steps.core.outputs.notificationScalerIdentityId }}' \
              serviceBusFqdn='${{ steps.core.outputs.serviceBusFqdn }}' \
              serviceBusNamespace='${{ steps.core.outputs.serviceBusName }}' \
              serviceBusQueue='${{ steps.core.outputs.notificationQueueName }}' \
              registryServer='${{ steps.core.outputs.registryLoginServer }}' \
              image='${{ steps.image.outputs.notification }}' \
              telegramChatId='${{ vars.TELEGRAM_CHAT_ID }}' \
              telegramBotTokenSecretUri='${{ vars.TELEGRAM_BOT_TOKEN_SECRET_URI }}' \
              evidenceBlobEndpoint='${{ steps.core.outputs.evidenceBlobEndpoint }}' \
              evidenceContainer='${{ steps.core.outputs.evidenceContainerName }}' \
            --query properties.outputs.appName.value \
            -o tsv

      # -----------------------------------------------------------------------
      # Deploy business dashboard
      # -----------------------------------------------------------------------

      - name: Deploy the business dashboard
        id: dashboard
        run: |
          url=$(az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/dashboard.bicep \
            --name "dashboard-${GITHUB_SHA::7}" \
            --parameters \
              environmentId='${{ steps.core.outputs.environmentId }}' \
              identityId='${{ steps.core.outputs.dashboardIdentityId }}' \
              identityClientId='${{ steps.core.outputs.dashboardIdentityClientId }}' \
              logAnalyticsWorkspaceId='${{ steps.core.outputs.logAnalyticsWorkspaceId }}' \
              cosmosEndpoint='${{ steps.core.outputs.cosmosEndpoint }}' \
              cosmosDatabase='${{ steps.core.outputs.cosmosDatabaseName }}' \
              cosmosContainer='${{ steps.core.outputs.cosmosContainerName }}' \
              evidenceBlobEndpoint='${{ steps.core.outputs.evidenceBlobEndpoint }}' \
              evidenceContainer='${{ steps.core.outputs.evidenceContainerName }}' \
              image='${{ steps.image.outputs.dashboard }}' \
            --query properties.outputs.url.value \
            -o tsv)

          echo "url=${url}" >> "$GITHUB_OUTPUT"

      - name: Verify the dashboard is serving
        run: |
          url='${{ steps.dashboard.outputs.url }}'

          for attempt in $(seq 1 20); do
            if curl -fsS --max-time 20 "${url}/_stcore/health"; then
              echo "::notice::Dashboard healthy at ${url}"
              exit 0
            fi

            sleep 6
          done

          echo "::error::${url}/_stcore/health did not respond" >&2
          exit 1

      # -----------------------------------------------------------------------
      # Verify ingestion deployment
      # -----------------------------------------------------------------------

      - name: Verify the deployment
        run: |
          url='${{ steps.app.outputs.url }}'

          for attempt in $(seq 1 20); do
            body=$(curl -fsS \
              --max-time 20 \
              "${url}/health" \
              || true)

            if echo "$body" | grep -q '"status":"healthy"'; then

              if echo "$body" | grep -q '"publisher":"servicebus"'; then

                ready=$(curl -fsS \
                  --max-time 20 \
                  "${url}/ready" \
                  || true)

                if ! echo "$ready" | grep -q '"status":"ready"'; then
                  echo "::error::${url} is healthy but not ready to publish: ${ready}" >&2
                  exit 1
                fi

                if ! echo "$body" | grep -q '"auth":"entra"'; then
                  echo "::error::${url} is serving with authentication disabled: ${body}" >&2
                  exit 1
                fi

                anon=$(curl \
                  -s \
                  -o /dev/null \
                  -w '%{http_code}' \
                  --max-time 20 \
                  -X POST \
                  "${url}/api/v1/incidents" \
                  -H 'content-type: application/json' \
                  -d '{
                    "event_id":"EVT-ANON",
                    "tenant_id":"T",
                    "site_id":"S",
                    "source_id":"C",
                    "source_name":"n",
                    "source_type":"video_analytics",
                    "analytics_type":"intrusion_detection",
                    "event_type":"intrusion_detected",
                    "severity":"low",
                    "timestamp":"2026-01-01T00:00:00"
                  }')

                if [ "$anon" != "401" ]; then
                  echo "::error::An unauthenticated POST returned ${anon}, expected 401. The API is open." >&2
                  exit 1
                fi

                echo "::notice::Deployed, healthy, ready, and refusing anonymous writes at ${url}"
                exit 0
              fi

              echo "::error::${url}/health is healthy but not publishing to Service Bus: ${body}" >&2
              exit 1
            fi

            sleep 6
          done

          echo "::error::${url}/health did not report healthy" >&2
          exit 1

      # -----------------------------------------------------------------------
      # Verify worker end-to-end
      # -----------------------------------------------------------------------

      - name: Verify the worker drains the queue
        run: |
          url='${{ steps.app.outputs.url }}'
          namespace='${{ steps.core.outputs.serviceBusName }}'
          queue='${{ steps.core.outputs.incidentQueueName }}'

          counts() {
            az servicebus queue show \
              --resource-group "$RESOURCE_GROUP" \
              --namespace-name "$namespace" \
              --name "$queue" \
              --query '[countDetails.activeMessageCount, countDetails.deadLetterMessageCount]' \
              -o tsv
          }

          read_counts() {
            local out

            out="$(counts)"

            active="$(echo "$out" | sed -n 1p)"
            dead="$(echo "$out" | sed -n 2p)"

            case "${active}:${dead}" in
              *[!0-9:]*|:*|*:)
                echo "::error::Could not read queue counts (active='${active}' dead='${dead}'). The az query shape changed." >&2
                exit 1
                ;;
            esac
          }

          read_counts

          active_before=$active
          dead_before=$dead

          echo "before: active=${active_before} dead-lettered=${dead_before}"

          token=$(az account get-access-token \
            --resource '${{ vars.AUTH_AUDIENCE }}' \
            --query accessToken \
            -o tsv \
            2>/dev/null \
            || true)

          if [ -z "$token" ]; then
            echo "::error::Could not get a token for ${{ vars.AUTH_AUDIENCE }}. The deploy identity needs the Incidents.Write app role and an entry in TENANT_MAP." >&2
            exit 1
          fi

          body=$(curl \
            -sS \
            --max-time 30 \
            -w '\n<<HTTP:%{http_code}>>' \
            -X POST \
            "${url}/api/v1/incidents" \
            -H "Authorization: Bearer ${token}" \
            -H 'content-type: application/json' \
            -d "{
              \"event_id\": \"EVT-CD-${GITHUB_SHA::7}-$(date +%s)\",
              \"tenant_id\": \"${{ vars.CD_TENANT_ID }}\",
              \"site_id\": \"SITE-CD\",
              \"source_id\": \"CAM-CD\",
              \"source_name\": \"Deployment verification\",
              \"source_type\": \"video_analytics\",
              \"analytics_type\": \"intrusion_detection\",
              \"event_type\": \"intrusion_detected\",
              \"severity\": \"low\",
              \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%S)\",
              \"confidence\": 0.99,
              \"description\": \"Synthetic incident from the CD pipeline\"
            }")

          if ! echo "$body" | grep -q '"status":"accepted"'; then
            echo "::error::Ingestion did not accept the verification incident. Response: ${body}" >&2

            echo "$body" \
              | grep -o '"detail":"[^"]*"' >&2 \
              || true

            exit 1
          fi

          echo "published one incident through ${url}"

          # Wait up to five minutes for the Worker to consume the message.
          for attempt in $(seq 1 30); do
            sleep 10

            read_counts

            if [ "$dead" -gt "$dead_before" ]; then
              echo "::error::The worker dead-lettered the incident instead of processing it (dead-letter count ${dead_before} -> ${dead}). Check the worker logs." >&2
              exit 1
            fi

            if [ "$active" -eq 0 ]; then
              echo "::notice::Worker drained ${queue} after $((attempt * 10))s"
              drained=yes
              break
            fi

            echo "waiting: ${active} message(s) still on ${queue}"
          done

          if [ "${drained:-no}" != "yes" ]; then
            echo "::error::${queue} still holds ${active} message(s) after 5 minutes; the worker is not consuming" >&2
            exit 1
          fi

          # Draining proves the queue emptied, not that the incident was kept.
          # A worker that cannot store will eventually dead-letter the message.
          # A worker with INCIDENT_STORE unset could drain it without
          # persisting it, so explicitly verify the deployed configuration.
          store=$(az containerapp show \
            --resource-group "$RESOURCE_GROUP" \
            --name incident-worker \
            --query "properties.template.containers[0].env[?name=='INCIDENT_STORE'].value | [0]" \
            -o tsv)

          if [ "$store" != "cosmos" ]; then
            echo "::error::The worker drained ${queue} but is not configured to persist (INCIDENT_STORE='${store}'). It is consuming incidents and discarding them." >&2
            exit 1
          fi

          echo "::notice::Worker is consuming and persisting to Cosmos"

      # -----------------------------------------------------------------------
      # Deploy load simulator
      # -----------------------------------------------------------------------

      - name: Deploy the load simulator job
        run: |
          outputs=$(az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/simulator.bicep \
            --name "simulator-${GITHUB_SHA::7}" \
            --parameters \
              environmentId='${{ steps.core.outputs.environmentId }}' \
              registryName='${{ steps.core.outputs.registryName }}' \
              targetUrl='${{ steps.app.outputs.url }}' \
              authAudience='${{ vars.AUTH_AUDIENCE }}' \
              image='${{ steps.image.outputs.simulator }}' \
            --query properties.outputs \
            -o json)

          echo "::notice::Load simulator job: $(echo "$outputs" | jq -r '.jobName.value')"
          echo "::notice::TENANT_MAP needs: $(echo "$outputs" | jq -r '.tenantMapAdditions.value | join(",")')"
          echo "::notice::Grant Incidents.Write to: $(echo "$outputs" | jq -r '.producerPrincipalIds.value | join(", ")')"

      # -----------------------------------------------------------------------
      # Resource-health workbook
      # -----------------------------------------------------------------------

      - name: Deploy resource-health workbook
        continue-on-error: true
        run: |
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/workbook.bicep \
            --name "workbook-${GITHUB_SHA::7}" \
            --parameters \
              logAnalyticsWorkspaceId='${{ steps.core.outputs.logAnalyticsWorkspaceId }}'

      # -----------------------------------------------------------------------
      # Baseline alerting on the resource-health workbook's data
      # -----------------------------------------------------------------------

      - name: Deploy infrastructure alerts
        continue-on-error: true
        run: |
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/alerts.bicep \
            --name "alerts-${GITHUB_SHA::7}" \
            --parameters \
              serviceBusNamespaceName='${{ steps.core.outputs.serviceBusName }}' \
              incidentQueueName='${{ steps.core.outputs.incidentQueueName }}' \
              cosmosAccountName='${{ steps.core.outputs.cosmosAccountName }}' \
              alertEmails='${{ vars.ALERT_EMAILS }}'
