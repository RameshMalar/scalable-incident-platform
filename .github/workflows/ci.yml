name: CI

# Every feature-branch push and pull request to main is built and tested.
on:
  push:
    branches-ignore:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Common event model
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: The model must be identical in every service that speaks it
        run: |
          diff ingestion-service/app/models.py worker-service/app/models.py
          diff worker-service/app/models.py notification-service/app/models.py

  test:
    name: Unit tests (${{ matrix.service }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: ingestion-service
            bandit_target: app
          - service: worker-service
            bandit_target: app
          - service: notification-service
            bandit_target: app
          - service: business-dashboard
            bandit_target: .

    defaults:
      run:
        working-directory: ${{ matrix.service }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests -v

  build:
    name: Build image and smoke test (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: test

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: ingestion-service
            image: incident-ingestion

          - service: worker-service
            image: incident-worker

          - service: notification-service
            image: incident-notification

          - service: business-dashboard
            image: incident-dashboard

    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: |
          for attempt in 1 2 3; do
            if docker build -t ${{ matrix.image }}:ci ./${{ matrix.service }}; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 20))
              echo "::warning::Build attempt ${attempt} failed, retrying in ${delay}s"
              sleep "$delay"
            fi
          done

          echo "::error::Build failed after 3 attempts" >&2
          exit 1

      - name: Smoke test ingestion container
        if: matrix.service == 'ingestion-service'
        run: |
          docker run -d --name smoke -p 8000:8000 ${{ matrix.image }}:ci

          for attempt in $(seq 1 15); do
            if curl -fsS http://localhost:8000/health; then
              echo "healthy after ${attempt} attempt(s)"

              curl -fsS http://localhost:8000/ready \
                | grep -q '"status":"ready"'

              exit 0
            fi

            sleep 2
          done

          echo "service never became healthy" >&2
          docker logs smoke >&2
          exit 1

      - name: Smoke test worker container
        if: matrix.service == 'worker-service'
        run: |
          output=$(docker run --rm ${{ matrix.image }}:ci 2>&1) && rc=0 || rc=$?

          echo "$output"

          if [ "$rc" -ne 2 ]; then
            echo "::error::worker exited ${rc}, expected 2 for missing configuration" >&2
            exit 1
          fi

          echo "$output" | grep -q 'SERVICE_BUS_FQDN is required'

      - name: Smoke test notification container
        if: matrix.service == 'notification-service'
        run: |
          output=$(docker run --rm ${{ matrix.image }}:ci 2>&1) && rc=0 || rc=$?

          echo "$output"

          if [ "$rc" -ne 1 ]; then
            echo "::error::notification service exited ${rc}, expected 1 for missing configuration" >&2
            exit 1
          fi

          echo "$output" | grep -q 'SERVICE_BUS_FQDN is required'

      # No COSMOS_ENDPOINT here, same as the ingestion smoke test running with
      # no Service Bus: the server must still come up and answer its own
      # health check, even though every session that connects will show an
      # error banner instead of data.
      - name: Smoke test the dashboard container
        if: matrix.service == 'business-dashboard'
        run: |
          docker run -d --name smoke -p 8501:8501 ${{ matrix.image }}:ci
          for attempt in $(seq 1 15); do
            if curl -fsS http://localhost:8501/_stcore/health; then
              echo "healthy after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "service never became healthy" >&2
          docker logs smoke >&2
          exit 1


      - name: Scan image for known vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image }}:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Record the full scan report
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image }}:ci
          format: json
          output: trivy-report.json
          severity: HIGH,CRITICAL
          skip-setup-trivy: true

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-report-${{ matrix.image }}
          path: trivy-report.json

  security:
    name: Source and dependency scanning (${{ matrix.service }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: ingestion-service
            bandit_target: app
          - service: worker-service
            bandit_target: app
          - service: notification-service
            bandit_target: app
          - service: business-dashboard
            bandit_target: .

    defaults:
      run:
        working-directory: ${{ matrix.service }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install scanners
        run: pip install bandit==1.8.0 pip-audit==2.7.3

      - name: Scan source for insecure patterns
        run: bandit -r ${{ matrix.bandit_target }} -ll

      - name: Scan dependencies for known vulnerabilities
        run: pip-audit -r requirements.txt