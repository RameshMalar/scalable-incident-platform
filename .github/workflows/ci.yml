name: CI

# Every feature-branch push and pull request to main is built and tested.
on:
  push:
    branches-ignore:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Common event model
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # There is one copy of the model now, so there is nothing left to diff
      # between services. What is worth checking instead is that the contract
      # still promises what they rely on -- including that an unknown
      # analytics_type is accepted, which is the platform's extensibility claim.
      - name: Test the contract
        run: |
          pip install ./packages/common-event-model pytest==9.1.1
          python -m pytest packages/common-event-model/tests -v

  infra:
    name: Infrastructure preview
    runs-on: ubuntu-latest

    # Reviewing an infrastructure change otherwise means trusting the diff.
    # `what-if` compares the template against the live subscription, which
    # catches what `bicep build` cannot: a stale API version, an `existing`
    # reference to something that is not there, a change to an immutable
    # property. It also needs Role Based Access Control Administrator to preview
    # role assignments, which no person here holds -- so running it as the
    # deploy identity is what puts the preview in reach of everyone.
    #
    # Pull requests only. The deploy identity federates `pull_request` and
    # `refs/heads/main`, not a feature-branch push, and a pull request from a
    # fork is issued no id-token at all by design.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Only core.bicep. The service templates take their parameters from core's
      # outputs, so previewing them would mean deploying core first, which is
      # the one thing a pull request must not do.
      #
      # The same parameters CD passes, so the preview is of what merging does
      # rather than of a template nobody deploys.
      - name: Preview the change to core infrastructure
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          az deployment group what-if \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/core.bicep \
            --parameters \
              developerPrincipalIds='${{ vars.DEVELOPER_PRINCIPAL_IDS }}' \
            --no-pretty-print \
            -o json >what-if.json

      # Raw what-if output on this template reports 40-odd property changes, of
      # which three are real. Left unfiltered it trains everyone to skim past
      # the summary, which defeats the point of having one, so each known class
      # of false positive is counted rather than listed:
      #
      #   - a value taken from another resource, which what-if cannot evaluate at
      #     preview time and reports as the literal `reference(...)` expression
      #   - a property the template does not declare, which an incremental
      #     deployment leaves alone rather than removing
      #   - a change the API itself marks NoEffect
      #
      # Resource-level creates and deletes are always listed. A delete should
      # never appear, since CD deploys incrementally.
      - name: Summarise it
        run: |
          python3 - <<'PY' >>"$GITHUB_STEP_SUMMARY"
          import collections
          import json

          changes = json.load(open("what-if.json"))["changes"]
          counts = collections.Counter(c["changeType"] for c in changes)

          def name(change):
              return "/".join(change["resourceId"].split("/")[6:]) or change["resourceId"]

          print("## Infrastructure preview\n")
          print(" · ".join(f"**{n} {t.lower()}**"
                           for t, n in sorted(counts.items())) or "No changes.")

          for kind, heading in (("Create", "Created"), ("Delete", "Deleted")):
              listed = [c for c in changes if c["changeType"] == kind]
              if listed:
                  print(f"\n### {heading}\n")
                  for change in listed:
                      print(f"- `{name(change)}`")

          real = []
          discounted = collections.Counter()
          for change in changes:
              if change["changeType"] != "Modify":
                  continue
              for delta in change.get("delta") or []:
                  after = delta.get("after")
                  if after == delta.get("before"):
                      discounted["the same value reported as changing"] += 1
                  elif isinstance(after, str) and after.startswith("["):
                      discounted["a reference this preview cannot evaluate"] += 1
                  elif delta["propertyChangeType"] == "NoEffect":
                      discounted["reported as having no effect"] += 1
                  elif delta["propertyChangeType"] == "Delete":
                      discounted["a property the template does not declare"] += 1
                  else:
                      real.append((name(change), delta))

          if real:
              print("\n### Changed properties\n")
              for resource, delta in real:
                  print(f"- `{resource}` — `{delta['path']}`: "
                        f"`{json.dumps(delta.get('before'))}` → "
                        f"`{json.dumps(delta.get('after'))}`")

          if discounted:
              print("\nNot counted above: " + ", ".join(
                  f"{n} {reason}" for reason, n in sorted(discounted.items())) + ".")
          PY

  test:
    name: Unit tests (${{ matrix.service }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - ingestion-service
          - worker-service
          - notification-service
          - load-simulator

    defaults:
      run:
        working-directory: ${{ matrix.service }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements-dev.txt

      # From the repository root, not the service directory: requirements.txt
      # installs the Common Event Model by path, and pip resolves a path
      # requirement against the working directory rather than against the file it
      # was read from.
      - name: Install dependencies
        working-directory: .
        run: pip install -r ${{ matrix.service }}/requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests -v

  build:
    name: Build image and smoke test (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: test

    strategy:
      fail-fast: false
      matrix:
        # `context` is the repository root for the services that install the
        # Common Event Model, because a Dockerfile can only copy from inside its
        # own context. The other two do not speak the model and keep the smaller
        # context -- the load simulator deliberately so, since it stands in for a
        # third-party producer that has the published contract and not our source.
        include:
          - service: ingestion-service
            image: incident-ingestion
            context: .

          - service: worker-service
            image: incident-worker
            context: .

          - service: notification-service
            image: incident-notification
            context: .

          - service: business-dashboard
            image: incident-dashboard
            context: ./business-dashboard

          - service: load-simulator
            image: incident-load-simulator
            context: ./load-simulator

    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: |
          for attempt in 1 2 3; do
            if docker build -t ${{ matrix.image }}:ci \
                 -f ${{ matrix.service }}/Dockerfile ${{ matrix.context }}; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 20))
              echo "::warning::Build attempt ${attempt} failed, retrying in ${delay}s"
              sleep "$delay"
            fi
          done

          echo "::error::Build failed after 3 attempts" >&2
          exit 1

      - name: Smoke test ingestion container
        if: matrix.service == 'ingestion-service'
        run: |
          docker run -d --name smoke -p 8000:8000 ${{ matrix.image }}:ci

          for attempt in $(seq 1 15); do
            if curl -fsS http://localhost:8000/health; then
              echo "healthy after ${attempt} attempt(s)"

              curl -fsS http://localhost:8000/ready \
                | grep -q '"status":"ready"'

              exit 0
            fi

            sleep 2
          done

          echo "service never became healthy" >&2
          docker logs smoke >&2
          exit 1

      - name: Smoke test worker container
        if: matrix.service == 'worker-service'
        run: |
          output=$(docker run --rm ${{ matrix.image }}:ci 2>&1) && rc=0 || rc=$?

          echo "$output"

          if [ "$rc" -ne 2 ]; then
            echo "::error::worker exited ${rc}, expected 2 for missing configuration" >&2
            exit 1
          fi

          echo "$output" | grep -q 'SERVICE_BUS_FQDN is required'

      - name: Smoke test notification container
        if: matrix.service == 'notification-service'
        run: |
          output=$(docker run --rm ${{ matrix.image }}:ci 2>&1) && rc=0 || rc=$?

          echo "$output"

          if [ "$rc" -ne 1 ]; then
            echo "::error::notification service exited ${rc}, expected 1 for missing configuration" >&2
            exit 1
          fi

          echo "$output" | grep -q 'SERVICE_BUS_FQDN is required'

      # Streamlit answers its own health endpoint whether or not the script it
      # serves can be imported, so a missing module or an un-copied file passes
      # the check below and only shows up as a blank page in production. Import
      # every module the app imports, inside the image, first.
      - name: Check the dashboard's modules are in the image
        if: matrix.service == 'business-dashboard'
        run: |
          docker run --rm ${{ matrix.image }}:ci \
            python -c "import app, evidence" 2>&1 | tee import.log || true

          # Importing `app` also runs the page, which then fails trying to reach
          # Cosmos with no COSMOS_ENDPOINT set. Reaching that failure is the
          # proof we want: it means every import above it resolved. So only the
          # import errors are fatal here.
          if grep -qE 'ModuleNotFoundError|ImportError|SyntaxError' import.log; then
            echo "::error::the dashboard image cannot import its own modules" >&2
            exit 1
          fi

      # No COSMOS_ENDPOINT here, same as the ingestion smoke test running with
      # no Service Bus: the server must still come up and answer its own
      # health check, even though every session that connects will show an
      # error banner instead of data.
      - name: Smoke test the dashboard container
        if: matrix.service == 'business-dashboard'
        run: |
          docker run -d --name smoke -p 8501:8501 ${{ matrix.image }}:ci

          for attempt in $(seq 1 15); do
            if curl -fsS http://localhost:8501/_stcore/health; then
              echo "healthy after ${attempt} attempt(s)"
              exit 0
            fi

            sleep 2
          done

          echo "service never became healthy" >&2
          docker logs smoke >&2
          exit 1

      # The simulator has no endpoint either, and unlike the worker it is
      # supposed to exit: it drives a profile and stops. So the check is the
      # same shape as the worker's -- start with nothing configured and require
      # it to refuse the job by name rather than hang, crash on an import, or
      # worse, start driving load at a default target.
      - name: Smoke test the load simulator container
        if: matrix.service == 'load-simulator'
        run: |
          output=$(docker run --rm ${{ matrix.image }}:ci 2>&1) && rc=0 || rc=$?

          echo "$output"

          if [ "$rc" -ne 2 ]; then
            echo "::error::simulator exited ${rc}, expected 2 for missing configuration" >&2
            exit 1
          fi

          echo "$output" | grep -q 'TARGET_URL is required'

      # Code scanning upload needs GitHub Advanced Security, which this private
      # repository does not have. The report is kept as a build artifact and the
      # gate is enforced by failing the job instead.
      - name: Scan image for known vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image }}:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Record the full scan report
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image }}:ci
          format: json
          output: trivy-report.json
          severity: HIGH,CRITICAL
          skip-setup-trivy: true

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-report-${{ matrix.image }}
          path: trivy-report.json

  security:
    name: Source and dependency scanning (${{ matrix.service }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: ingestion-service
            bandit_target: app

          - service: worker-service
            bandit_target: app

          - service: notification-service
            bandit_target: app

          - service: business-dashboard
            bandit_target: .

          - service: load-simulator
            bandit_target: app

    defaults:
      run:
        working-directory: ${{ matrix.service }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install scanners
        run: pip install bandit==1.8.0 pip-audit==2.7.3

      - name: Scan source for insecure patterns
        run: bandit -r ${{ matrix.bandit_target }} -ll

      # From the repository root, for the same reason the test job installs from
      # there: pip-audit resolves the requirements with pip, and the path to the
      # Common Event Model is relative to the working directory.
      - name: Scan dependencies for known vulnerabilities
        working-directory: .
        run: pip-audit -r ${{ matrix.service }}/requirements.txt