name: CI

# Every feature-branch push and pull request to main is built and tested.
on:
  push:
    branches-ignore:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

  # CD calls these same checks at its exact selected commit before deployment.
  workflow_call:

permissions:
  contents: read

jobs:
  bicep:
    name: Compile infrastructure locally
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compile Bicep without an Azure login
        run: |
          for template in infra/*.bicep; do
            az bicep build --file "$template" --outfile "${RUNNER_TEMP}/$(basename "${template%.bicep}").json"
          done

  integration:
    name: Local cross-service integration (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            worker-service/requirements-dev.txt
            notification-service/requirements-dev.txt
            subscription-service/requirements-dev.txt
      - name: Install the three services' test dependencies
        run: pip install -r worker-service/requirements-dev.txt -r notification-service/requirements-dev.txt -r subscription-service/requirements-dev.txt PyYAML==6.0.3
      - name: Run shared-state integration tests with mocked external boundaries
        run: python -m pytest tests/local_integration/test_phase3.py tests/local_integration/test_workflow_safety.py -v -o asyncio_mode=auto
      - name: Validate workflow graphs, Bicep contracts and Bash syntax without cloud access
        run: python tests/local_integration/validate_phase3b2.py

  contract:
    name: Common event model
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # There is one copy of the model now, so there is nothing left to diff
      # between services. What is worth checking instead is that the contract
      # still promises what they rely on -- including that an unknown
      # analytics_type is accepted, which is the platform's extensibility claim.
      - name: Test the contract
        run: |
          pip install ./packages/common-event-model pytest==9.1.1
          python -m pytest packages/common-event-model/tests -v

  producer-sdk:
    name: Producer SDK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The evidence extra is installed so the upload tests can import
      # azure.core.exceptions. They never talk to Azure: the blob service is
      # faked, because a tenant Conditional Access policy would refuse any
      # user credential we could give CI anyway.
      - name: Test the producer SDK
        run: |
          pip install ./packages/common-event-model \
                      './packages/producer-sdk[evidence]' \
                      pytest==9.1.1
          python -m pytest packages/producer-sdk/tests -v

  test:
    name: Unit tests (${{ matrix.service }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - ingestion-service
          - worker-service
          - notification-service
          - subscription-service
          - load-simulator

    defaults:
      run:
        working-directory: ${{ matrix.service }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements-dev.txt

      # From the repository root, not the service directory: requirements.txt
      # installs the Common Event Model by path, and pip resolves a path
      # requirement against the working directory rather than against the file it
      # was read from.
      - name: Install dependencies
        working-directory: .
        run: pip install -r ${{ matrix.service }}/requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests -v

  build:
    name: Build image and smoke test (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [contract, producer-sdk, bicep, test, integration]

    strategy:
      fail-fast: false
      matrix:
        # `context` is the repository root for the services that install the
        # Common Event Model, because a Dockerfile can only copy from inside its
        # own context. The other two do not speak the model and keep the smaller
        # context -- the load simulator deliberately so, since it stands in for a
        # third-party producer that has the published contract and not our source.
        include:
          - service: ingestion-service
            image: incident-ingestion
            context: .

          - service: worker-service
            image: incident-worker
            context: .

          - service: notification-service
            image: incident-notification
            context: .

          - service: subscription-service
            image: incident-subscription
            context: ./subscription-service

          - service: business-dashboard
            image: incident-dashboard
            context: ./business-dashboard

          - service: load-simulator
            image: incident-load-simulator
            context: ./load-simulator

    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: |
          for attempt in 1 2 3; do
            if docker build --platform linux/amd64 -t ${{ matrix.image }}:ci \
                 -f ${{ matrix.service }}/Dockerfile ${{ matrix.context }}; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 20))
              echo "::warning::Build attempt ${attempt} failed, retrying in ${delay}s"
              sleep "$delay"
            fi
          done

          echo "::error::Build failed after 3 attempts" >&2
          exit 1

      - name: Smoke test ingestion container
        if: matrix.service == 'ingestion-service'
        run: |
          docker run -d --name smoke -p 8000:8000 ${{ matrix.image }}:ci

          for attempt in $(seq 1 15); do
            if curl -fsS http://localhost:8000/health; then
              echo "healthy after ${attempt} attempt(s)"

              curl -fsS http://localhost:8000/ready \
                | grep -q '"status":"ready"'

              exit 0
            fi

            sleep 2
          done

          echo "service never became healthy" >&2
          docker logs smoke >&2
          exit 1

      - name: Smoke test worker container
        if: matrix.service == 'worker-service'
        run: |
          output=$(docker run --rm ${{ matrix.image }}:ci 2>&1) && rc=0 || rc=$?

          echo "$output"

          if [ "$rc" -ne 2 ]; then
            echo "::error::worker exited ${rc}, expected 2 for missing configuration" >&2
            exit 1
          fi

          echo "$output" | grep -q 'SERVICE_BUS_FQDN is required'

      - name: Smoke test notification container
        if: matrix.service == 'notification-service'
        run: |
          output=$(docker run --rm ${{ matrix.image }}:ci 2>&1) && rc=0 || rc=$?

          echo "$output"

          if [ "$rc" -ne 1 ]; then
            echo "::error::notification service exited ${rc}, expected 1 for missing configuration" >&2
            exit 1
          fi

          echo "$output" | grep -q 'SERVICE_BUS_FQDN is required'

      # Streamlit answers its own health endpoint whether or not the script it
      # serves can be imported, so a missing module or an un-copied file passes
      # the check below and only shows up as a blank page in production. Import
      # every module the app imports, inside the image, first.
      - name: Check the dashboard's modules are in the image
        if: matrix.service == 'business-dashboard'
        run: |
          docker run --rm ${{ matrix.image }}:ci \
            python -c "import app, evidence" 2>&1 | tee import.log || true

          # Importing `app` also runs the page, which then fails trying to reach
          # Cosmos with no COSMOS_ENDPOINT set. Reaching that failure is the
          # proof we want: it means every import above it resolved. So only the
          # import errors are fatal here.
          if grep -qE 'ModuleNotFoundError|ImportError|SyntaxError' import.log; then
            echo "::error::the dashboard image cannot import its own modules" >&2
            exit 1
          fi
      - name: Verify legacy and routed notification compatibility in the image
        if: matrix.service == 'notification-service'
        run: |
          docker run --rm --network none \
            --mount "type=bind,source=${GITHUB_WORKSPACE}/scripts/verify-notification-compatibility.py,target=/verify.py,readonly" \
            --entrypoint python ${{ matrix.image }}:ci /verify.py

      - name: Smoke test Subscription API in local development mode
        if: matrix.service == 'subscription-service'
        run: |
          test "$(docker run --rm --network none --entrypoint id ${{ matrix.image }}:ci -u)" != '0'
          docker run --rm --network none --entrypoint python ${{ matrix.image }}:ci \
            -c 'import sys; import app.main; assert sys.version_info[:2] == (3, 12)'
          docker run -d --name smoke -p 127.0.0.1:8000:8000 \
            -e AUTH_MODE=development -e DEV_TENANT_ID=TENANT-CI \
            -e SUBSCRIPTION_STORE=memory ${{ matrix.image }}:ci

          for attempt in $(seq 1 15); do
            if curl -fsS http://localhost:8000/health; then
              curl -fsS http://localhost:8000/ready | grep -q '"status":"ready"'
              exit 0
            fi
            sleep 2
          done

          echo "::error::Subscription API never became healthy" >&2
          docker logs smoke >&2
          exit 1

      # No COSMOS_ENDPOINT here, same as the ingestion smoke test running with
      # no Service Bus: the server must still come up and answer its own
      # health check, even though every session that connects will show an
      # error banner instead of data.
      #
      # With no sign-in configured at all the image must refuse to start, by
      # name, rather than serve a page nobody can pass (auth_preflight.py).
      # The health check then runs with platform (Easy Auth) sign-in, which
      # the preflight leaves to Container Apps.
      - name: Smoke test the dashboard container
        if: matrix.service == 'business-dashboard'
        run: |
          output=$(docker run --rm ${{ matrix.image }}:ci 2>&1) && rc=0 || rc=$?
          echo "$output"
          if [ "$rc" -ne 1 ] || ! echo "$output" | grep -q 'dashboard auth preflight FAILED'; then
            echo "::error::the dashboard started without sign-in configuration (exit ${rc})" >&2
            exit 1
          fi

          docker run -d --name smoke -p 8501:8501 -e DASHBOARD_AUTH_MODE=easyauth ${{ matrix.image }}:ci

          for attempt in $(seq 1 15); do
            if curl -fsS http://localhost:8501/_stcore/health; then
              echo "healthy after ${attempt} attempt(s)"
              exit 0
            fi

            sleep 2
          done

          echo "service never became healthy" >&2
          docker logs smoke >&2
          exit 1

      # The simulator has no endpoint either, and unlike the worker it is
      # supposed to exit: it drives a profile and stops. So the check is the
      # same shape as the worker's -- start with nothing configured and require
      # it to refuse the job by name rather than hang, crash on an import, or
      # worse, start driving load at a default target.
      - name: Smoke test the load simulator container
        if: matrix.service == 'load-simulator'
        run: |
          output=$(docker run --rm ${{ matrix.image }}:ci 2>&1) && rc=0 || rc=$?

          echo "$output"

          if [ "$rc" -ne 2 ]; then
            echo "::error::simulator exited ${rc}, expected 2 for missing configuration" >&2
            exit 1
          fi

          echo "$output" | grep -q 'TARGET_URL is required'

      # Code scanning upload needs GitHub Advanced Security, which this private
      # repository does not have. The report is kept as a build artifact and the
      # gate is enforced by failing the job instead.
      - name: Scan image for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ matrix.image }}:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Record the full scan report
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ matrix.image }}:ci
          format: json
          output: trivy-report.json
          severity: HIGH,CRITICAL
          skip-setup-trivy: true

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-report-${{ matrix.image }}
          path: trivy-report.json

  security:
    name: Source and dependency scanning (${{ matrix.service }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: ingestion-service
            bandit_target: app

          - service: worker-service
            bandit_target: app

          - service: notification-service
            bandit_target: app

          - service: subscription-service
            bandit_target: app

          - service: business-dashboard
            bandit_target: .

          - service: load-simulator
            bandit_target: app

    defaults:
      run:
        working-directory: ${{ matrix.service }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install scanners
        run: pip install bandit==1.8.0 pip-audit==2.7.3

      - name: Scan source for insecure patterns
        run: bandit -r ${{ matrix.bandit_target }} -ll

      # From the repository root, for the same reason the test job installs from
      # there: pip-audit resolves the requirements with pip, and the path to the
      # Common Event Model is relative to the working directory.
      - name: Scan dependencies for known vulnerabilities
        working-directory: .
        run: pip-audit -r ${{ matrix.service }}/requirements.txt

      # The two gates above decide pass or fail. These steps only record what
      # they saw, pass or fail: an HTML report per service as an artifact, and
      # a summary on the run's page. Bandit records every severity, including
      # the Low findings the gate lets through.
      - name: Record the scan reports
        if: always()
        working-directory: .
        run: |
          mkdir -p security-report
          bandit -r "${{ matrix.service }}/${{ matrix.bandit_target }}" --exit-zero -f html -o security-report/bandit.html
          bandit -r "${{ matrix.service }}/${{ matrix.bandit_target }}" --exit-zero -f json -o security-report/bandit.json
          pip-audit -r "${{ matrix.service }}/requirements.txt" -f json -o security-report/pip-audit.json || true
          python3 scripts/security-summary.py "${{ matrix.service }}" security-report >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the scan reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-report-${{ matrix.service }}
          path: security-report/
          if-no-files-found: ignore

  workflow-safety:
    name: Workflow security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install PyYAML==6.0.3 pytest==9.1.1
      - run: python -m pytest tests/workflow_security -v -p no:cacheprovider

  gate:
    name: Required CI gate
    runs-on: ubuntu-latest
    if: always()
    needs: [contract, producer-sdk, bicep, test, integration, build, security, workflow-safety]
    steps:
      - name: Require every local test, build and security check to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' >/dev/null
