name: CI

# Every push and every pull request is built and tested. Nothing reaches main
# without passing this workflow.
on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingestion-service
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ingestion-service/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests -v

  build:
    name: Build image and smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      # Same upstream exposure as the deploy pipeline: pulling the base image
      # from Docker Hub fails often enough that a single attempt turns an
      # unrelated outage into a red pull request.
      - name: Build image
        run: |
          for attempt in 1 2 3; do
            if docker build -t incident-ingestion:ci ./ingestion-service; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 20))
              echo "::warning::Build attempt ${attempt} failed, retrying in ${delay}s"
              sleep "$delay"
            fi
          done
          echo "::error::Build failed after 3 attempts" >&2
          exit 1

      # Catches the failures unit tests cannot see: a broken Dockerfile, a
      # missing runtime dependency, an app that starts but never serves.
      - name: Smoke test the running container
        run: |
          docker run -d --name smoke -p 8000:8000 incident-ingestion:ci
          for attempt in $(seq 1 15); do
            if curl -fsS http://localhost:8000/health; then
              echo "healthy after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "service never became healthy" >&2
          docker logs smoke >&2
          exit 1

      # Code scanning upload needs GitHub Advanced Security, which this private
      # repository does not have. The report is kept as a build artifact and the
      # gate is enforced by failing the job instead.
      - name: Scan image for known vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: incident-ingestion:ci
          format: table
          severity: HIGH,CRITICAL
          # Only fail on findings we can actually act on. An unfixed CVE in the
          # base image is not something this build can resolve.
          ignore-unfixed: true
          exit-code: '1'

      - name: Record the full scan report
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: incident-ingestion:ci
          format: json
          output: trivy-report.json
          severity: HIGH,CRITICAL
          skip-setup-trivy: true

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-report
          path: trivy-report.json

  security:
    name: Source and dependency scanning
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingestion-service
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install scanners
        run: pip install bandit==1.8.0 pip-audit==2.7.3

      # Static analysis of our own source. Replaces CodeQL, which is not
      # available on a private repository without Advanced Security.
      - name: Scan source for insecure patterns
        run: bandit -r app -ll

      - name: Scan dependencies for known vulnerabilities
        run: pip-audit -r requirements.txt
