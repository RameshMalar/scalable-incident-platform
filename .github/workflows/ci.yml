name: CI

# Every push and every pull request is built and tested. Nothing reaches main
# without passing this workflow.
on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingestion-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ingestion-service/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests -v

  build:
    name: Build image and smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t incident-ingestion:ci ./ingestion-service

      # Catches the failures unit tests cannot see: a broken Dockerfile, a
      # missing runtime dependency, an app that starts but never serves.
      - name: Smoke test the running container
        run: |
          docker run -d --name smoke -p 8000:8000 incident-ingestion:ci
          for attempt in $(seq 1 15); do
            if curl -fsS http://localhost:8000/health; then
              echo "healthy after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "service never became healthy" >&2
          docker logs smoke >&2
          exit 1

      - name: Scan image for known vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: incident-ingestion:ci
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL

      - name: Publish scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
