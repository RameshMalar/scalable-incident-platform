[theme]
# LML SENTINEL: dark navy, cyan and white (sampled from assets/).
# primaryColor is a deeper cyan so white button and chip text stays readable.
base = "dark"
primaryColor = "#0891b2"
backgroundColor = "#001227"
secondaryBackgroundColor = "#082039"
textColor = "#edf5ff"
font = "sans serif"

[client]
# No developer menu or "Deploy" button for viewers, wherever the app is served.
toolbarMode = "viewer"
