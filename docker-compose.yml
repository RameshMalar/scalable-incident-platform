# Local development only. The cloud runtime is Azure Container Apps -- see the
# README. Builds from source rather than pulling a published image so local
# changes are picked up without a registry round trip.
services:

  incident-ingestion:
    # Context is the repository root, matching CI and CD: the Dockerfile installs
    # the Common Event Model from packages/, and it can only copy from inside its
    # own context.
    build:
      context: .
      dockerfile: ingestion-service/Dockerfile

    container_name: incident-ingestion

    ports:
      - "8000:8000"

    volumes:
      - ./ingestion-service/app:/app/app:ro

    restart: unless-stopped
